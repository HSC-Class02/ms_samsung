<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼성전자 DART 재무 대시보드</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px}.hero{background:#111827;color:#fff;border-radius:24px;padding:34px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:32px}.muted{color:#6b7280;font-size:13px}.hero .muted{color:#cbd5e1}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:20px;box-shadow:0 4px 18px #1720330a}.label{font-size:13px;color:#6b7280}.value{font-size:25px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}.chart{height:340px}.panel h2{font-size:18px;margin:0 0 16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px 12px;border-bottom:1px solid #e6eaf0;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:#6b7280;background:#fafbfc}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:14px}.hero h1{font-size:25px}}</style></head><body><main class="wrap">
<section class="hero"><h1>삼성전자 재무 대시보드</h1><div>DART 정기보고서 기반 · 사업보고서 / 반기보고서 / 분기보고서</div><div id="updated" class="muted"></div></section>
<section id="cards" class="cards"></section><section class="grid"><div class="panel chart"><h2>매출액 · 영업이익</h2><canvas id="profitChart"></canvas></div><div class="panel chart"><h2>영업이익률 · ROE</h2><canvas id="ratioChart"></canvas></div></section>
<section class="panel" style="margin-bottom:22px"><h2>연간</h2><div id="annual" class="table-wrap"></div></section>
<section class="panel" style="margin-bottom:22px"><h2>반기</h2><div id="half" class="table-wrap"></div></section>
<section class="panel" style="margin-bottom:22px"><h2>분기</h2><div id="quarterly" class="table-wrap"></div></section>
<section class="panel"><h2>국내 비교기업</h2><div class="table-wrap"><table><thead><tr><th>기업</th><th>종목코드</th><th>참고 분야</th></tr></thead><tbody><tr><td>SK하이닉스</td><td>000660</td><td>메모리 반도체</td></tr><tr><td>LG전자</td><td>066570</td><td>전자·가전</td></tr><tr><td>삼성전기</td><td>009150</td><td>전자부품</td></tr><tr><td>삼성SDI</td><td>006400</td><td>배터리·전자재료</td></tr><tr><td>DB하이텍</td><td>000990</td><td>파운드리</td></tr></tbody></table></div><p class="muted">참고 비교군이며 투자 추천 순위가 아닙니다.</p></section></main>
<script>
const fmt=(v,p=false)=>v==null?"-":p?Number(v).toFixed(1)+"%":new Intl.NumberFormat("ko-KR",{maximumFractionDigits:0}).format(v);
function makeTable(el,rows){if(!rows.length){el.innerHTML="<p class='muted'>데이터가 아직 없습니다. Actions를 실행하면 생성됩니다.</p>";return}const c=["year","report","revenue","operating_profit","net_income","assets","liabilities","equity","operating_margin","net_margin","roe"];const n={year:"연도",report:"보고서",revenue:"매출액",operating_profit:"영업이익",net_income:"순이익",assets:"자산",liabilities:"부채",equity:"자본",operating_margin:"영업이익률",net_margin:"순이익률",roe:"ROE"};el.innerHTML="<table><thead><tr>"+c.map(x=>"<th>"+n[x]+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+c.map(x=>"<td>"+(x==="report"?r[x]:(x==="operating_margin"||x==="net_margin"||x==="roe"?fmt(r[x],true):fmt(r[x])))+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
fetch("data.json").then(r=>r.json()).then(d=>{document.getElementById("updated").textContent="마지막 갱신: "+new Date(d.updated_at).toLocaleString("ko-KR");const all=[...d.annual,...d.half,...d.quarterly].sort((a,b)=>b.year-a.year);const x=all[0]||{};document.getElementById("cards").innerHTML=[["최근 매출액",fmt(x.revenue)],["최근 영업이익",fmt(x.operating_profit)],["최근 순이익",fmt(x.net_income)],["영업이익률",fmt(x.operating_margin,true)],["ROE",fmt(x.roe,true)]].map(a=>"<div class='card'><div class='label'>"+a[0]+"</div><div class='value'>"+a[1]+"</div></div>").join("");makeTable(document.getElementById("annual"),d.annual);makeTable(document.getElementById("half"),d.half);makeTable(document.getElementById("quarterly"),d.quarterly);const a=[...d.annual].sort((m,n)=>m.year-n.year);new Chart(document.getElementById("profitChart"),{type:"line",data:{labels:a.map(v=>v.year),datasets:[{label:"매출액",data:a.map(v=>v.revenue)},{label:"영업이익",data:a.map(v=>v.operating_profit)}]},options:{responsive:true,maintainAspectRatio:false}});new Chart(document.getElementById("ratioChart"),{type:"line",data:{labels:a.map(v=>v.year),datasets:[{label:"영업이익률",data:a.map(v=>v.operating_margin)},{label:"ROE",data:a.map(v=>v.roe)}]},options:{responsive:true,maintainAspectRatio:false}})}).catch(()=>document.getElementById("cards").innerHTML="<div class='card'>데이터 생성 전입니다.</div>");
</script></body></html>
